name: 更新招聘数据

on:
  schedule:
    # 每 6 小时一次（UTC）：北京时间 02:00 / 08:00 / 14:00 / 20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取并合并数据
        run: node scripts/update.mjs

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "本次没有新数据"
          else
            git commit -m "chore: 同步招聘数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') UTC+8"
            git push
          fi
